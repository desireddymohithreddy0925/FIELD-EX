<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIELD-EX Presentation Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .slide-container {
      width: 90vw;
      max-width: 1100px;
      height: 70vh;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      position: relative;
    }
    .slide-header {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #10b981;
      font-weight: 700;
    }
    .slide-content h1 {
      font-size: 38px;
      margin-top: 12px;
      color: #ffffff;
      line-height: 1.2;
    }
    .slide-content h2 {
      font-size: 22px;
      color: #94a3b8;
      margin-top: 8px;
      font-weight: 400;
    }
    .slide-body {
      margin-top: 24px;
      font-size: 18px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .slide-body ul {
      margin-left: 24px;
      margin-top: 12px;
    }
    .slide-body li {
      margin-bottom: 12px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #064e3b;
      color: #34d399;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #334155;
      padding-top: 16px;
      font-size: 13px;
      color: #64748b;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    button {
      background: #334155;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <div class="slide-container" id="slideCard">
    <div class="slide-header" id="slideHeader">Slide 1 of 10</div>
    <div class="slide-content">
      <div id="slideBadge"></div>
      <h1 id="slideTitle">Loading...</h1>
      <h2 id="slideSubtitle"></h2>
      <div class="slide-body" id="slideBody"></div>
    </div>
    <div class="footer">
      <span>FIELD-EX Enterprise Agro-Export Platform</span>
      <span id="slideCounter">1 / 10</span>
    </div>
  </div>

  <div class="controls">
    <button onclick="prevSlide()">← Previous</button>
    <button onclick="nextSlide()">Next →</button>
  </div>

  <script>
    const slides = [
      {
        badge: "Executive Overview",
        title: "FIELD-EX Platform Architecture",
        subtitle: "B2B International Agro-Export & Cold-Chain Supply Chain Platform",
        body: "<p>A production-grade, domain-driven operating system designed to bridge Indian farm-gate procurement with overseas international markets across Europe, the Middle East, and Asia.</p><ul><li>Deterministic B2B State Machines for commercial orders and container reefers</li><li>Digital QC rubric scoring (Brix, caliber, firmness, defects)</li><li>Continuous cold-chain temperature telemetry monitoring</li><li>Digital export documentation vault & automated customs staging</li><li>Real-time Admin activity watchdog stream & operational calendar</li></ul>"
      },
      {
        badge: "Industry Context",
        title: "The Core Industry Pain Points",
        subtitle: "Why perishable agricultural exports suffer catastrophic losses",
        body: "<ul><li><strong>25%+ Post-Harvest Losses:</strong> Delicate crops like Alphonso mangoes, pomegranates, and table grapes degrade during uncontrolled transit.</li><li><strong>Cold-Chain Opacity:</strong> Buyers face blind transit; a single temperature excursion ruins an entire container.</li><li><strong>Commercial Quality Disputes:</strong> Rejections at destination ports due to undocumented quality degradation.</li><li><strong>Fragmented Communication:</strong> Disparate tools (WhatsApp, paper certificates, emails) leading to clearance demurrage.</li></ul>"
      },
      {
        badge: "The Solution",
        title: "The FIELD-EX Digital Operating System",
        subtitle: "Unifying the value chain under strict role-based governance",
        body: "<ul><li><strong>Transparent Produce Catalog & Price Fixing:</strong> Real-time FOB pricing, metric ton inventory, Brix sweetness ratings, and cultivar specifications.</li><li><strong>Deterministic State Machines:</strong> Strict finite state transitions enforcing payment verification, packhouse packing, and export dispatch.</li><li><strong>Operations Calendar API:</strong> End-to-end tracking of order placement, packhouse completion, vessel transit, and port arrival.</li><li><strong>Order Lifecycle History:</strong> Immutable audit trail of every status change, actor, and compliance note accessible to Admin & Manager.</li></ul>"
      },
      {
        badge: "RBAC & Portals",
        title: "5 Dedicated Stakeholder Portals",
        subtitle: "Enterprise role separation with delegated managerial authority",
        body: "<ul><li><strong>Operations Admin (<code>/admin</code>):</strong> Full system governance, unrestricted user provisioning, live watchdog event stream, price fixing, order lifecycle history.</li><li><strong>Operations Manager (<code>/manager</code>):</strong> Delegated role assignment (Buyer, QC, Logistics), catalog price fixing, order lifecycle history, operations calendar.</li><li><strong>International Buyer (<code>/buyer</code>):</strong> Browse produce cultivars & fixed prices, request RFQs, review orders, and track container telemetry.</li><li><strong>QC Inspector (<code>/qc</code>):</strong> Digital inspection scoring, Brix refractive testing, caliber grading, and quarantine enforcement.</li><li><strong>Logistics Director (<code>/logistics</code>):</strong> Cold storage allocation, pallet packaging, customs documentation, and port dispatch.</li></ul>"
      },
      {
        badge: "Architecture",
        title: "Robust Modular Monolith Architecture",
        subtitle: "Modern, high-performance technology stack",
        body: "<ul><li><strong>Backend:</strong> Java 25, Spring Boot 3.x, Spring Security (Stateless JWT), Spring Data JPA, Hibernate Envers, Liquibase.</li><li><strong>Frontend:</strong> React 19, TypeScript, Vite, Tailwind CSS, Recharts, Lucide Icons.</li><li><strong>Database:</strong> PostgreSQL 17 with Liquibase automated migrations; In-memory H2 for tests.</li><li><strong>Storage & Caching:</strong> Redis 7, MinIO S3 Object Storage, Mailpit.</li></ul>"
      },
      {
        badge: "Commercial Governance",
        title: "Catalog Variety Pricing & Quality Specs",
        subtitle: "Live commercial controls for Admin and Operations Manager",
        body: "<ul><li><strong>Price Fixing:</strong> Currency-denominated pricing per kg / MT (USD, EUR, GBP, AED, INR).</li><li><strong>Inventory Allocation:</strong> Live available stock and Minimum Order Quantity (MOQ) configuration.</li><li><strong>Quality Specs:</strong> Export Grade A/Extra, Brix sugar sweetness rating, and cultivar characteristics.</li><li><strong>Interactive Management:</strong> Modals for updating prices, quality parameters, and adding new varieties.</li></ul>"
      },
      {
        badge: "Visibility & Tracking",
        title: "Operations Calendar & Milestones API",
        subtitle: "Complete operational visibility from farm-gate to consignee receipt",
        body: "<ul><li><strong>Calendar Event Feed:</strong> Automatic aggregation of placed dates, payment receipts, packhouse completions, export dispatches, customs, and port arrivals.</li><li><strong>Carrier Telemetry:</strong> Vessel details, bill of lading numbers, container IDs, and port ETA.</li><li><strong>Interactive View:</strong> Milestone timeline cards with status filters accessible by Admin and Manager.</li></ul>"
      },
      {
        badge: "Security & Auditing",
        title: "Security, Role Delegation & Audit Watchdog",
        subtitle: "Enterprise compliance and tamper-proof traceability",
        body: "<ul><li><strong>Role Delegation:</strong> Admin assigns all roles; Manager provisions Buyer, QC Inspector, and Logistics roles.</li><li><strong>Protected HQ Accounts:</strong> Admin and Manager accounts cannot be escalated or modified by subordinate roles.</li><li><strong>Immutable Order Lifecycle History:</strong> Every transition records actor name, role, email, timestamp, and notes.</li><li><strong>Real-Time Watchdog Stream:</strong> Live activity feed on Admin Dashboard monitoring all auth, role, and order events.</li></ul>"
      },
      {
        badge: "Verification",
        title: "Automated Test Suite & Code Quality",
        subtitle: "100% test pass rate with zero errors",
        body: "<ul><li><strong>Backend Test Suite:</strong> 97 automated tests passing with 0 failures and 0 errors.</li><li><strong>State Machine & Concurrency:</strong> Strict validation of transition preconditions, optimistic locking, and access control.</li><li><strong>Frontend Build:</strong> Vite & React 19 build completed with 0 TypeScript compilation errors.</li><li><strong>Clean Startup:</strong> Deprecated Hibernate dialects and startup warnings eliminated.</li></ul>"
      },
      {
        badge: "Roadmap",
        title: "Summary & Strategic Roadmap",
        subtitle: "Foundation ready for Phase 2 physical expansion",
        body: "<ul><li><strong>Production Ready:</strong> Complete B2B export workflow, role delegation, catalog pricing, and calendar tracking.</li><li><strong>Phase 2 Planned Enhancements:</strong> Physical IoT hardware sensors and MQTT brokers, live banking SWIFT wire rails, and commercial satellite AIS vessel tracking feeds.</li></ul>"
      }
    ];

    let currentSlide = 0;

    function renderSlide() {
      const slide = slides[currentSlide];
      document.getElementById("slideHeader").innerText = `Slide ${currentSlide + 1} of ${slides.length}`;
      document.getElementById("slideCounter").innerText = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById("slideBadge").innerHTML = slide.badge ? `<span class="badge">${slide.badge}</span>` : "";
      document.getElementById("slideTitle").innerText = slide.title;
      document.getElementById("slideSubtitle").innerText = slide.subtitle;
      document.getElementById("slideBody").innerHTML = slide.body;
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
    });

    renderSlide();
  </script>
</body>
</html>
